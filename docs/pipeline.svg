<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1000" height="340" rx="12" fill="#fafafa"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#71717a"/>
    </marker>
  </defs>
  <g font-size="12.5" fill="#3f3f46">
    <!-- Inputs -->
    <rect x="20" y="40" width="170" height="104" rx="10" fill="#ffffff" stroke="#d4d4d8"/>
    <text x="105" y="70" text-anchor="middle" font-weight="600" font-size="14.5" fill="#18181b">Live feed</text>
    <text x="105" y="92" text-anchor="middle">LiveSource: simulated</text>
    <text x="105" y="109" text-anchor="middle">replay or licensed API</text>
    <text x="105" y="126" text-anchor="middle">poller → live_events</text>

    <rect x="20" y="196" width="170" height="104" rx="10" fill="#ffffff" stroke="#d4d4d8"/>
    <text x="105" y="226" text-anchor="middle" font-weight="600" font-size="14.5" fill="#18181b">A year of history</text>
    <text x="105" y="248" text-anchor="middle">per train, date, stop:</text>
    <text x="105" y="265" text-anchor="middle">scheduled vs actual</text>
    <text x="105" y="282" text-anchor="middle">→ run_stops</text>

    <!-- Statistics -->
    <rect x="225" y="20" width="300" height="300" rx="12" fill="#fff7ed" stroke="#ea580c"/>
    <text x="375" y="46" text-anchor="middle" font-weight="600" font-size="14.5" fill="#7c2d12">Traditional data science (Python)</text>
    <g font-size="12">
      <rect x="245" y="60" width="260" height="40" rx="6" fill="#ffffff" stroke="#fdba74"/>
      <text x="375" y="77" text-anchor="middle" font-weight="600" fill="#18181b">added vs inherited delay</text>
      <text x="375" y="92" text-anchor="middle">hotspots, cluster-bootstrap intervals</text>
      <rect x="245" y="108" width="260" height="40" rx="6" fill="#ffffff" stroke="#fdba74"/>
      <text x="375" y="125" text-anchor="middle" font-weight="600" fill="#18181b">seasonality</text>
      <text x="375" y="140" text-anchor="middle">month × station, hour of day</text>
      <rect x="245" y="156" width="260" height="40" rx="6" fill="#ffffff" stroke="#fdba74"/>
      <text x="375" y="173" text-anchor="middle" font-weight="600" fill="#18181b">punctuality → the badge</text>
      <text x="375" y="188" text-anchor="middle">on-time %, median, p90, last 90 days</text>
      <rect x="245" y="204" width="260" height="40" rx="6" fill="#ffffff" stroke="#fdba74"/>
      <text x="375" y="221" text-anchor="middle" font-weight="600" fill="#18181b">p50 / p90 arrival forecast</text>
      <text x="375" y="236" text-anchor="middle">quantile GBM vs persistence, time split</text>
      <rect x="245" y="252" width="260" height="34" rx="6" fill="#ffffff" stroke="#fdba74"/>
      <text x="375" y="273" text-anchor="middle" font-weight="600" fill="#18181b">unusual today?</text>
    </g>
    <text x="375" y="308" text-anchor="middle" fill="#9a3412">every result is a list of named facts</text>

    <!-- Chat -->
    <rect x="565" y="20" width="250" height="300" rx="12" fill="#eef2ff" stroke="#6366f1"/>
    <text x="690" y="46" text-anchor="middle" font-weight="600" font-size="14.5" fill="#312e81">Chatbot</text>
    <rect x="585" y="60" width="210" height="44" rx="8" fill="#ffffff" stroke="#6366f1"/>
    <text x="690" y="78" text-anchor="middle" font-weight="600" fill="#18181b">Intent (Claude)</text>
    <text x="690" y="94" text-anchor="middle">"22448 ka status kya hai?"</text>
    <rect x="585" y="116" width="210" height="58" rx="8" fill="#ffffff" stroke="#a5b4fc"/>
    <text x="690" y="134" text-anchor="middle" font-weight="600" fill="#18181b">Resolve in code</text>
    <text x="690" y="150" text-anchor="middle">train exists? station on route?</text>
    <text x="690" y="166" text-anchor="middle" fill="#b45309">no → ask, never guess</text>
    <rect x="585" y="186" width="210" height="44" rx="8" fill="#ffffff" stroke="#a5b4fc"/>
    <text x="690" y="204" text-anchor="middle" font-weight="600" fill="#18181b">Tools → facts</text>
    <text x="690" y="220" text-anchor="middle">status, forecast, badge, hotspots</text>
    <rect x="585" y="242" width="210" height="58" rx="8" fill="#ffffff" stroke="#6366f1"/>
    <text x="690" y="260" text-anchor="middle" font-weight="600" fill="#18181b">Reply (Claude)</text>
    <text x="690" y="276" text-anchor="middle">every sentence cites fact ids;</text>
    <text x="690" y="292" text-anchor="middle">uncited numbers are dropped</text>

    <!-- Output -->
    <rect x="850" y="96" width="130" height="148" rx="10" fill="#ffffff" stroke="#16a34a"/>
    <text x="915" y="126" text-anchor="middle" font-weight="600" font-size="14.5" fill="#18181b">Passenger</text>
    <text x="915" y="150" text-anchor="middle">live status card</text>
    <text x="915" y="168" text-anchor="middle">ETA p50 - p90</text>
    <text x="915" y="186" text-anchor="middle">"usually X min</text>
    <text x="915" y="204" text-anchor="middle">late here"</text>
    <text x="915" y="226" text-anchor="middle" fill="#15803d">EN or Hinglish</text>
  </g>
  <g stroke="#71717a" stroke-width="1.6" fill="none">
    <line x1="190" y1="92" x2="222" y2="92" marker-end="url(#arrow)"/>
    <line x1="190" y1="248" x2="222" y2="248" marker-end="url(#arrow)"/>
    <line x1="525" y1="170" x2="562" y2="170" marker-end="url(#arrow)"/>
    <line x1="815" y1="170" x2="847" y2="170" marker-end="url(#arrow)"/>
    <line x1="690" y1="104" x2="690" y2="114" marker-end="url(#arrow)"/>
    <line x1="690" y1="174" x2="690" y2="184" marker-end="url(#arrow)"/>
    <line x1="690" y1="230" x2="690" y2="240" marker-end="url(#arrow)"/>
  </g>
</svg>
